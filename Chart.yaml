apiVersion: v2
name: helm-law-scraw
description: Helm chart for the scraw law-crawling stack — scrapyd + SAMR contracts runner (CronJob) + Bitnami redis + Bitnami postgresql
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: redis
    version: "27.0.15"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
  - name: postgresql
    version: "18.8.0"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled