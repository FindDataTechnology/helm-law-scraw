{{- if and (not .Values.imageCredentials.existingSecret) .Values.imageCredentials.username .Values.imageCredentials.password .Values.imageCredentials.host -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helm-law-scraw.imagePullSecretName" . }}
  labels:
    {{- include "helm-law-scraw.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "helm-law-scraw.dockerconfigjson" . }}
{{- end -}}