{{- /*
One CronJob per entry under legalSources.sources. Object names are the bare
source keys (rmfyalk-case-crawl, ..., flk-law-backfill) to match the xinru
live inventory verbatim - NO release prefix. Images come from
images.legalSources (ccr registry, pinned sha); per-source `image` overrides
the repository/tag while keeping the registry (rmfyalk runs the auth-broker
image). No imagePullSecrets: nodes already hold ccr credentials.
*/ -}}
{{- range $sourceId, $source := .Values.legalSources.sources }}
{{- $repo := $.Values.images.legalSources.repository }}
{{- $tag := $.Values.images.legalSources.tag }}
{{- with $source.image }}
{{- $repo = .repository }}
{{- $tag = .tag }}
{{- end }}
{{- $cronName := $source.name | default $sourceId }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $cronName }}
  labels:
    app.kubernetes.io/name: {{ $cronName }}
    app.kubernetes.io/part-of: finddata
spec:
  schedule: {{ $source.schedule | quote }}
  suspend: {{ $source.suspend }}
  concurrencyPolicy: {{ $source.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      {{- with $source.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $cronName }}
            {{- if $source.sourceLabel }}
            legal.finddata.io/source: {{ $sourceId }}
            {{- end }}
            {{- with $source.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          {{- include "helm-law-scraw.imagePullSecrets" $ | nindent 10 }}
          restartPolicy: OnFailure
          containers:
            - name: crawler
              image: "{{ include "helm-law-scraw.image" (dict "registry" $.Values.images.legalSources.registry "repository" $repo "tag" $tag) }}"
              imagePullPolicy: {{ $.Values.images.legalSources.pullPolicy }}
              {{- include "helm-law-scraw.legalResources" $.Values.legalSources | nindent 14 }}
              env:
                {{- include "helm-law-scraw.legalRustfsEnv" $.Values.legalSources | nindent 16 }}
                {{- include "helm-law-scraw.legalTelemetryEnv" (dict "telemetry" $.Values.legalSources.telemetry "imageTag" $.Values.images.legalSources.tag) | nindent 16 }}
                {{- with $source.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              command:
{{ toYaml $source.command | indent 16 }}
{{- end }}
