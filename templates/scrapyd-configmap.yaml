{{- if .Values.scrapyd.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm-law-scraw.fullname" . }}-scrapyd
  labels:
    {{- include "helm-law-scraw.labels" . | nindent 4 }}
data:
  scrapyd.conf: |
    [scrapyd]
    eggs_dir     = /var/lib/scrapyd/eggs
    logs_dir     = /var/lib/scrapyd/logs
    items_dir    =
    dbs_dir      = /var/lib/scrapyd/dbs
    jobs_to_keep = {{ .Values.scrapyd.config.jobsToKeep }}
    dbs_to_keep  = {{ .Values.scrapyd.config.dbsToKeep }}
    max_proc     = {{ .Values.scrapyd.config.maxProc }}
    http_port    = 6800
    bind_address = 0.0.0.0
    debug        = off
{{- end }}
