{{- /*
lease-api Deployment + Service, converged to the the db host live objects named
`legal-auth-broker` (no release prefix; the crawlers reach it at
http://legal-auth-broker.scraw). Image is the Harbor registry-mirror build,
NOT images.legalSources. Live pod carries NO imagePullSecrets.
*/ -}}
{{- if .Values.authBroker.enabled }}
{{- $brokerName := .Values.authBroker.name | default "legal-auth-broker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $brokerName }}
  labels:
    app.kubernetes.io/name: {{ $brokerName }}
    app.kubernetes.io/part-of: finddata
spec:
  replicas: {{ .Values.authBroker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $brokerName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $brokerName }}
        app.kubernetes.io/part-of: finddata
    spec:
      containers:
        - name: lease-api
          image: "{{ include "helm-law-scraw.image" (dict "registry" .Values.images.authBroker.registry "repository" .Values.images.authBroker.repository "tag" .Values.images.authBroker.tag) }}"
          imagePullPolicy: {{ .Values.images.authBroker.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.authBroker.service.targetPort }}
          env:
            - name: LEGAL_AUTH_BROKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authBroker.secretName }}
                  key: broker-token
            - name: LEGAL_AUTH_JAR_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authBroker.secretName }}
                  key: jar-key
            - name: LEGAL_AUTH_VNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authBroker.secretName }}
                  key: vnc-password
            - name: RUSTFS_ENDPOINT
              value: {{ required "缺少 authBroker.rustfs.endpoint：内网端点写在带外 values-private.yaml（已 gitignore）" .Values.authBroker.rustfs.endpoint | quote }}
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.legalSources.secretName }}
                  key: rustfs-access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.legalSources.secretName }}
                  key: rustfs-secret-key
            - name: RUSTFS_REGION
              value: {{ .Values.authBroker.rustfs.region | quote }}
            - name: LAWS_BUCKET
              value: {{ .Values.authBroker.lawsBucket | quote }}
            - name: PG_HOST
              value: {{ required "缺少 authBroker.postgres.host：内网主机写在带外 values-private.yaml（已 gitignore）" .Values.authBroker.postgres.host | quote }}
            - name: PG_PORT
              value: {{ .Values.authBroker.postgres.port | quote }}
            - name: PG_DATABASE
              value: {{ .Values.authBroker.postgres.database | quote }}
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authBroker.postgres.secretName }}
                  key: {{ .Values.authBroker.postgres.userKey }}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authBroker.postgres.secretName }}
                  key: {{ .Values.authBroker.postgres.passwordKey }}
            - name: LEGAL_AUTH_CRAWL_PROXY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-law-scraw.subst" (dict "Values" $.Values "text" .Values.authBroker.identitySecretName) }}
                  key: crawl_proxy_url
            - name: LEGAL_AUTH_LOGIN_PROXY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-law-scraw.subst" (dict "Values" $.Values "text" .Values.authBroker.identitySecretName) }}
                  key: login_proxy_url
          args: ["node", "bin/legal-auth-broker.mjs", "serve", "--host", "0.0.0.0", "--port", {{ .Values.authBroker.service.targetPort | quote }}]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.authBroker.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $brokerName }}
  labels:
    app.kubernetes.io/name: {{ $brokerName }}
    app.kubernetes.io/part-of: finddata
spec:
  type: {{ .Values.authBroker.service.type }}
  ports:
    - name: http
      port: {{ .Values.authBroker.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ $brokerName }}
{{- end }}
