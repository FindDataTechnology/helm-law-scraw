{{- /*
The 5 per-source load CronJobs (rmfyalk-case-load, ..., ccdi-supervisory-load)
and the legal-sources-report CronJob. Charted 2026-10-06 from the the db host live
inventory (09-24 manual applies). Names are the bare keys - NO release prefix.
Loaders/readers run images.legalSources (ccr registry, pinned sha); no
imagePullSecrets (nodes carry ccr credentials). Each gets the RustFS env plus
the PG env (report reads law_db from the new report code onwards).
*/ -}}
{{- range $loadId, $load := .Values.legalSources.loaders }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $loadId }}
  labels:
    app.kubernetes.io/name: {{ $loadId }}
    app.kubernetes.io/part-of: finddata
spec:
  schedule: {{ $load.schedule | quote }}
  suspend: {{ $load.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $load.activeDeadlineSeconds | default 7200 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $loadId }}
            legal.finddata.io/source: {{ $load.source }}
        spec:
          {{- include "helm-law-scraw.imagePullSecrets" $ | nindent 10 }}
          restartPolicy: OnFailure
          containers:
            - name: loader
              image: "{{ include "helm-law-scraw.image" (dict "registry" $.Values.images.legalSources.registry "repository" $.Values.images.legalSources.repository "tag" $.Values.images.legalSources.tag) }}"
              imagePullPolicy: {{ $.Values.images.legalSources.pullPolicy }}
              {{- include "helm-law-scraw.legalResources" $.Values.legalSources | nindent 14 }}
              env:
                {{- include "helm-law-scraw.legalNodeEnv" $.Values.legalSources | nindent 16 }}
                {{- include "helm-law-scraw.legalRustfsEnv" $.Values.legalSources | nindent 16 }}
                {{- include "helm-law-scraw.legalTelemetryEnv" (dict "telemetry" $.Values.legalSources.telemetry "imageTag" $.Values.images.legalSources.tag) | nindent 16 }}
                {{- include "helm-law-scraw.legalPgEnv" $.Values.legalSources | nindent 16 }}
              command:
{{ toYaml $load.command | indent 16 }}
{{- end }}
{{- $report := .Values.legalSources.report }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $report.name | default "legal-sources-report" }}
  labels:
    app.kubernetes.io/name: {{ $report.name | default "legal-sources-report" }}
    app.kubernetes.io/part-of: finddata
spec:
  schedule: {{ $report.schedule | quote }}
  suspend: {{ $report.suspend }}
  concurrencyPolicy: {{ $report.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $report.activeDeadlineSeconds | default 1800 }}
      # **backoffLimit: 0 才是真正的不重试**。restartPolicy: Never 只阻止容器内重启，
      # Job 层仍会按默认 backoffLimit=6 重试 7 次；而记录器每次退出都写一行
      # crawl_runs（2026-11-11 实测：一个日任务写出 7 条重复失败行，57→64）。
      # 报告是"体检结论"，失败不该重试。
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $report.name | default "legal-sources-report" }}
        spec:
          {{- include "helm-law-scraw.imagePullSecrets" $ | nindent 10 }}
          # 报告任务**不重试**：它的 `exit 2` 是结论（发现 stale / load_stalled），
          # 不是瞬时故障。原来 OnFailure 会让容器连退 3–7 次，而记录器每次退出都
          # 往 crawl_runs 写一行 —— 一天一个日任务实测写出 3–7 条重复失败行，
          # 把真实信号稀释掉（2026-11-11 逐条看 started_at 间隔确认：3 条一簇、
          # 间隔 12–102 秒）。爬虫侧保留 OnFailure（那里重试有意义）。
          restartPolicy: Never
          containers:
            - name: report
              image: "{{ include "helm-law-scraw.image" (dict "registry" .Values.images.legalSources.registry "repository" .Values.images.legalSources.repository "tag" .Values.images.legalSources.tag) }}"
              imagePullPolicy: {{ .Values.images.legalSources.pullPolicy }}
              {{- include "helm-law-scraw.legalResources" .Values.legalSources | nindent 14 }}
              env:
                {{- include "helm-law-scraw.legalNodeEnv" .Values.legalSources | nindent 16 }}
                {{- include "helm-law-scraw.legalRustfsEnv" .Values.legalSources | nindent 16 }}
                {{- include "helm-law-scraw.legalTelemetryEnv" (dict "telemetry" .Values.legalSources.telemetry "imageTag" .Values.images.legalSources.tag) | nindent 16 }}
                {{- include "helm-law-scraw.legalPgEnv" .Values.legalSources | nindent 16 }}
                # 未点亮的源（本清单里 suspend: true 的那些）：报告据此把「按点亮门
                # 合法停着」与「真断流」分开，不再让暂停源每天把日报告判红。
                # 源名由 values 渲染，报告不内省集群。
                - name: LEGAL_PAUSED_SOURCES
                  value: {{ include "helm-law-scraw.legalPausedSources" .Values.legalSources | quote }}
              command:
{{ toYaml $report.command | indent 16 }}
              {{- with $report.args }}
              args:
{{ toYaml . | indent 16 }}
              {{- end }}
