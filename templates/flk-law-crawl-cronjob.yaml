{{- /*
IN-SERVICE CronJob (suspend=false): xinru live truth, zero behavior change.
2026-10-14: migrated off the retired Harbor (decommissioned 2026-10-11 — the
job only survived on node image cache) onto ccr via images.flkLawCrawl, which
now tracks the same anchored tag as the legal-sources line. No pull secret:
nodes carry ccr credentials.
*/ -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flk-law-crawl
  labels:
    app.kubernetes.io/name: flk-law-crawl
    app.kubernetes.io/part-of: finddata
spec:
  schedule: {{ .Values.flkLawCrawl.schedule | quote }}
  suspend: {{ .Values.flkLawCrawl.suspend }}
  concurrencyPolicy: {{ .Values.flkLawCrawl.concurrencyPolicy }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      {{- with .Values.flkLawCrawl.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flk-law-crawl
        spec:
          {{- with .Values.images.flkLawCrawl.imagePullSecrets }}
          imagePullSecrets:
            {{- range . }}
            - name: {{ . }}
            {{- end }}
          {{- end }}
          restartPolicy: OnFailure
          containers:
            - name: crawler
              image: "{{ include "helm-law-scraw.image" (dict "registry" .Values.images.flkLawCrawl.registry "repository" .Values.images.flkLawCrawl.repository "tag" .Values.images.flkLawCrawl.tag) }}"
              imagePullPolicy: {{ .Values.images.flkLawCrawl.pullPolicy }}
              env:
                - name: RUSTFS_ENDPOINT
                  value: {{ required "缺少 flkLawCrawl.rustfs.endpoint：内网端点写在带外 values-private.yaml（已 gitignore）" .Values.flkLawCrawl.rustfs.endpoint | quote }}
                - name: RUSTFS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.flkLawCrawl.secretName }}
                      key: rustfs-access-key
                - name: RUSTFS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.flkLawCrawl.secretName }}
                      key: rustfs-secret-key
                - name: RUSTFS_REGION
                  value: {{ .Values.flkLawCrawl.rustfs.region | quote }}
                - name: LAWS_BUCKET
                  value: {{ .Values.flkLawCrawl.lawsBucket | quote }}
                - name: FLK_RATE_MS
                  value: {{ .Values.flkLawCrawl.rateMs | quote }}
                - name: FLK_PAGE_SIZE
                  value: {{ .Values.flkLawCrawl.pageSize | quote }}
                - name: FLK_LOOKBACK_DAYS
                  value: {{ .Values.flkLawCrawl.lookbackDays | quote }}
              command: ["node", "bin/flk-crawl.mjs"]
