# xinru-server1 安装 overlay — 法律线宿主（change legal-line-federation，用户裁定五机分布）
# server1 节点已有 ccr 认证（registries.yaml）→ 无需 imageCredentials
#
# ⚠ 2026-11-14：这份 overlay 一度把四个爬虫 + 五个 loader + report + flkLawCrawl
# 都写成 suspend: false，而 xinru-master（values.yaml）上同样这几条**正在跑**。
# 两侧同时在跑的证据不是清单而是数据：2026-11-13 那一轮 crawl_runs 里
# mfa-treaty / gov-rules / party-regulation / ccdi 各写了两行、image_tag 不同
# （master 自报 sha-e584fc5，server1 的 CronJob 跑 sha-b63d0d1）。
#
# 那条重复只在两侧 pod **都真起来**时才留痕：11-12 之前 server1 侧一直
# Failed 0/1（pod 没起来、不写行），所以这件事长期看不见。
#
# 纪律：切换宿主 = **同一次改动里两边一起翻**（这里 true + values.yaml 对应项 false），
# 或反之。只翻一侧就是两个执行者写同一张 crawl_runs、同一批 laws 行。
# `scripts/verify-site-exclusivity.py`（make verify-sites）拒绝「两边都活」。
#
# 现状（2026-11-14）：**裁定目的地是 server1**（2026-10-07 用户五机分布，见
# openspec archive 2026-10-12-legal-line-federation），但负载仍在 xinru-master 跑
# ——归档时没人关掉 master 侧。所以本文件此刻全 true（中转站供数中），切换配方见
# APPLY-NOTES「宿主切换：已裁定，未执行」。
# auth-broker 随线部署（Deployment，不是 cron，故不在这里声明）。
legalSources:
  sources:
    rmfyalk-case-library:
      # 2026-10-08: platform owns the trigger (crawl_sources.schedule 03:10;
      # dispatcher injects the leased platform session). The broker-mode
      # CronJob stays only as a manual fallback.
      suspend: true
    mfa-treaty-library:
      suspend: true
    gov-rules-library:
      suspend: true
    party-regulation-library:
      # 2026-11-14 切换试点（第一源）：真爬已在 server1 实测通过（Job Complete 17s、
      # crawl_runs 自报 image_tag=sha-c33bf67、日志可见）。master 侧同源已关。
      suspend: false
    ccdi-supervisory-regulations:
      suspend: true
  loaders:
    rmfyalk-case-load:
      suspend: true
    mfa-treaty-load:
      suspend: true
    gov-rules-load:
      suspend: true
    party-regulation-load:
      suspend: true
    ccdi-supervisory-load:
      suspend: true
    # base(values.yaml) 里 flk-law-load 是 false；overlay 不写 = 继承 false，
    # 于是「全部 suspend」这句话在渲染产物上从来不成立（2026-11-14 闸抓到的那条）。
    flk-law-load:
      suspend: true
  report:
    suspend: true
flkLawCrawl:
  suspend: true
flkLawEmbed:
    # base(values.yaml) 里 flk-law-embed 是 false；不写 = 继承 false，
    # 于是「全部 suspend」在渲染产物上不成立（2026-11-14 互斥闸）。
  suspend: true
