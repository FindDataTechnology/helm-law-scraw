# helm-law-scraw values
#
# Scrapyd + law-crawling stack with Redis and PostgreSQL.
# Image reference pattern: <registry>/<repository>:<tag>
#
# Default registry is Docker Hub. Override for private registries:
#   helm install ... --set registry=myregistry.example.com:5000/myproject

# --- Image registry ---
# Prepended to all image.repository values. Leave empty for bare image names.
# Example: "docker.io" -> images become "docker.io/scraw-ops-scrapyd:latest"
registry: docker.io

# --- Image pull credentials (optional) ---
# Set username/password to create an imagePullSecret, or set existingSecret
# to reuse a pre-created one. Leave all empty for public registries / Docker Hub.
imageCredentials:
  host: ""            # registry hostname for the auth in the imagePullSecret
  username: ""        # registry username (e.g. robot$project+name)
  password: ""
  existingSecret: ""  # pre-created imagePullSecret name; overrides username/password if set

nameOverride: ""
fullnameOverride: ""

images:
  scrapyd:
    # Full image path WITHOUT the registry prefix (registry is prepended automatically).
    # Example: registry=docker.io, repository=scraw-ops-scrapyd -> docker.io/scraw-ops-scrapyd:latest
    repository: scraw-ops-scrapyd
    tag: latest
    pullPolicy: Always
  lawContracts:
    repository: scraw-law-contracts
    tag: latest
    pullPolicy: Always

scrapyd:
  replicas: 1
  redisUrl: ""        # empty -> redis://<release>-redis-master:6379/0 (in-chart redis)
  config:
    maxProc: "4"
    jobsToKeep: "10"
    dbsToKeep: "5"

lawContracts:
  spider: samr_contracts
  schedule: "0 2 * * *"     # daily 02:00
  suspend: false
  concurrencyPolicy: Forbid
  redisUrl: ""              # empty -> in-chart redis
  sqlitePath: data/scraw.db
  jsonlPath: output/items.jl
  persistence:
    enabled: true
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi

# Bitnami subcharts
redis:
  enabled: true
  architecture: standalone
  # Auth is disabled by default because the chart's Redis URL has no password.
  # If you enable auth, update _helpers.tpl to include the password in the URL.
  auth:
    enabled: false

postgresql:
  enabled: true
  auth:
    # Set a password or leave empty; Bitnami generates one if empty.
    postgresPassword: "changeme"
    database: scraw