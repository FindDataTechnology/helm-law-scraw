# helm-law-scraw values
#
# Converged to the xinru cluster (k3s, namespace scraw) live inventory as of
# 2026-10-06. Chart-owned live objects: flk-law-crawl CronJob, legal-auth-broker
# Deployment+Service, the 5 wave-1 legal-source crawl CronJobs, flk-law-backfill,
# the 5 per-source load CronJobs and legal-sources-report. scrapyd,
# scraw-law-contracts, wenshu-crawl, redis and postgresql are DISABLED here
# (nothing live on xinru); flip their enabled flags only for a cluster that has
# them. See APPLY-NOTES.md for the standard render command and wave flips.
#
# Image reference pattern: <registry>/<repository>:<tag>. Each images.* entry
# carries its own registry override; the top-level `registry` is legacy and only
# used by the disabled legacy templates.

# --- Image registry (legacy; per-image registry overrides take precedence) ---
# Prepended to image.repository values that have no own `registry` key.
registry: docker.io

# --- Image pull credentials (optional) ---
# Set username/password to create an imagePullSecret, or set existingSecret
# to reuse a pre-created one. Leave all empty for public registries / Docker Hub.
imageCredentials:
  host: ""            # registry hostname for the auth in the imagePullSecret
  username: ""        # registry username (e.g. robot$project+name)
  password: ""
  existingSecret: ""  # pre-created imagePullSecret name; overrides username/password if set

nameOverride: ""
fullnameOverride: ""

images:
  # Every entry supports its own `registry` override; when set it wins over the
  # legacy top-level `registry`. The xinru live truth (2026-10-06) is:
  #   - in-change legal-sources objects run images from ccr.ccs.tencentyun.com
  #     (nodes carry ccr credentials; NO imagePullSecrets on these pods)
  #   - the in-service flk chain keeps its registry-mirror images from the retired
  #     internal Harbor（地址与项目名见带外 values-private.yaml，不进 git）
  legalSources:
    # fd-law-data images for the 5 wave-1 crawls, flk-law-backfill, the 5 loads
    # and legal-sources-report. Bump tag per wave (see APPLY-NOTES.md).
    # sha-7d89e71: incremental identity keys stabilised (rmfyalk case_no,
    # party canonical URL, gov-rules scheme-normalised URL) — see change
    # rmfyalk-incremental-identity. Without it every nightly run re-fetches
    # the whole corpus.
    # sha-b63d0d1 (2026-10-12): report job-failure semantics — only 断流
    # (stale_sources) fails the CronJob; prior tag contains everything above.
    # 2026-10-14 incident: 11 live objects pinned sha-7d89e71 while the tag had
    # been evicted from ccr (hkccr still had it; relay's seen-ledger never
    # re-pushes). Node image-GC then forced re-pulls → mass ImagePullBackOff.
    # Restoration = manual `tcr-relay-sync.sh lawcraw-business/fd-law-data
    # sha-7d89e71` + anchors.conf entry. Never pin a tag that is not anchored.
    registry: ccr.ccs.tencentyun.com
    repository: lawcraw-business/fd-law-data
    tag: sha-c33bf67
    pullPolicy: IfNotPresent
  flkLawCrawl:
    # IN-SERVICE (suspend=false) daily flk incremental crawl.
    # 2026-10-14 incident: this and authBroker were still pinned to the retired
    # Harbor（内网地址见 values-private.yaml；2026-10-11 退役）; they only kept
    # running on node image cache and died the moment pods were recreated.
    # Unified onto the legal-line tag (ccr sha-b63d0d1) so the whole line
    # shares one anchored, pull-able image. No pull secret: nodes hold ccr creds.
    registry: ccr.ccs.tencentyun.com
    repository: lawcraw-business/fd-law-data
    tag: sha-c33bf67
    pullPolicy: IfNotPresent
  authBroker:
    # lease-api Deployment. 2026-10-14: migrated off retired Harbor to ccr
    # (identical tag sha-b726e1f existed there all along).
    registry: ccr.ccs.tencentyun.com
    repository: lawcraw-business/legal-auth-broker
    tag: sha-c33bf67
    pullPolicy: IfNotPresent
  # --- legacy components, disabled on xinru (nothing live) ---
  scrapyd:
    # Full image path WITHOUT the registry prefix (top-level registry is prepended).
    repository: scraw-ops-scrapyd
    tag: latest
    pullPolicy: Always
  lawContracts:
    repository: scraw-law-contracts
    # Pinned to the MinIO-enabled build (commit b9a72ee). Bump on the next image.
    tag: sha-b9a72ee
    pullPolicy: Always
  wenshuCrawl:
    # Playwright image built from fd-law-data/Dockerfile.wenshu (browsers included).
    # Empty by default: the internal registry project name lives in the out-of-band
    # values-private.yaml (见 `images.wenshuCrawl.repository`)。仅在 enabled=true 时才
    # 渲染，届时缺值会**报错**而不是拼出一个错地址。
    repository: ""
    tag: v0.1.0
    pullPolicy: IfNotPresent

scrapyd:
  # Disabled on xinru: no scrapyd Deployment/Service/ConfigMap exists in the
  # live cluster (2026-10-06). Leave false so a chart apply cannot create one.
  enabled: false
  replicas: 1
  redisUrl: ""        # empty -> redis://<release>-redis-master:6379/0 (in-chart redis)
  config:
    maxProc: "4"
    jobsToKeep: "10"
    dbsToKeep: "5"

lawContracts:
  # Disabled on xinru: no law-contracts CronJob/PVC exists in the live cluster.
  enabled: false
  spider: samr_contracts
  schedule: "0 2 * * *"     # daily 02:00
  suspend: false
  concurrencyPolicy: Forbid
  redisUrl: ""              # empty -> in-chart redis
  sqlitePath: data/scraw.db
  jsonlPath: output/items.jl
  persistence:
    enabled: true
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi

# --- MinIO object storage (contract document archival) ---
# Surfaced as MINIO_* env on the law-contracts CronJob. accessKey/secretKey are
# placeholders here; supply real values via the ArgoCD valuesObject (local-only
# scraw.yaml) - never commit real credentials to this chart.
minio:
  endpoint: minio.minio.svc.cluster.local:9000
  accessKey: change-me
  secretKey: change-me
  secure: false
  bucket: scraw-law-contracts
  uploadEnabled: true

# --- flk law incremental crawl (fd-law-data) ---
# Daily crawl of newly published regulations from flk.npc.gov.cn into the
# `laws` bucket `incremental/` prefix. Crawler holds NO PG credentials — the
# loader (flk-load.mjs) runs separately on the data machine. rustfs credentials
# are placeholders; supply real values via local-only values, never committed.
# IN-SERVICE on xinru (suspend=false): every field here matches the live
# CronJob verbatim; change only in lockstep with the cluster.
flkLawCrawl:
  schedule: "30 2 * * *"    # daily 02:30; == live
  suspend: false            # == live; NEVER flip without the wave manual
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 14400   # == live
  secretName: flk-law-crawl-credentials
  lawsBucket: laws
  rateMs: 1100
  pageSize: 100
  lookbackDays: 7
  rustfs:
    # 内网端点不进 git：真源是带外 values-private.yaml（模板里 required 守卫，
    # 缺值时渲染即报错，不会静默连到空地址）。
    endpoint: ""
    region: us-east-1

# flk 增量 embed 作业（05:30，接在 04:30 的 flk-law-load 之后）。
# **2026-11-14 才进 chart**：它自 2026-10-19 起就在线上跑，但真源只有
# `fd-law-data/k8s/flk-embed-cronjob.yaml` 那份手工清单——chart 重建不出来，
# 换命名空间/新集群时它会静默消失，而症状是「检索里没有新法条」，
# 没有任何告警会响（同族：flk-law-load 10-06 被漏掉，40 天只爬不载）。
flkLawEmbed:
  schedule: "30 5 * * *"       # == live
  suspend: false               # == live
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 10800 # == live（3h）
  secretName: flk-law-crawl-credentials   # rustfs-access-key / rustfs-secret-key
  embedSecretName: flk-embed-credentials  # embed-api-key（永不进 git）
  lawsExportBucket: laws-export
  embedModel: "Qwen/Qwen3-Embedding-0.6B"
  qdrant:
    # 内网端点，同 rustfs：真源在 values-private.yaml
    url: ""
  qdrantCollection: law_chunks_v2
  rustfs:
    endpoint: ""
    region: us-east-1

# --- wave-1 authoritative legal sources (fd-law-data) ---
# Converged to the xinru live inventory (2026-10-06):
#   sources  = 5 wave-1 crawl CronJobs + flk-law-backfill (names = bare keys,
#              no release prefix)
#   loaders  = the 5 per-source load CronJobs (09-24 manual apply, now charted)
#   report   = legal-sources-report CronJob (09-24 manual apply, now charted)
# Crawl/loader/report images come from images.legalSources (ccr + pinned sha).
# Crons ship suspended; flip suspend per wave (see APPLY-NOTES.md). Credentials
# stay in Secrets; never commit real values to this chart.
#
# 点亮门 (lighting-up gate) — a source may be unsuspended only when ALL hold:
#   fix merged on main / image pinned to an immutable sha-<short> from the TCR
#   channel / one manual dry-run passed sampled QA (ccdi: ≥95% capture rate of
#   source-side entries that have a body page; party: entry count matches the
#   enumerated category baseline) / no open blocker.
# Then a 3-day observation window per source: daily freshness stays inside the
# 48h green line and the daily report shows no stale verdict.
#
# Image channel (never Jenkins→Harbor; Harbor retired 2026-10-11):
#   push → GitHub Actions image.yml → hkccr.ccs.tencentyun.com/lawcraw-business
#   → cheap-3 tcr-relay (cron */5) → ccr.ccs.tencentyun.com/lawcraw-business
# Warm with `crictl pull` before rolling — the relay can lag Actions by minutes.
# If Actions is billing-blocked, delta-build on xinru-server2 (see fd-law-data
# README).
#
# 巡检: legal-sources-report writes laws/legal-sources/report/report-YYYYMMDD.json
# daily; a gap in that series is the only report-outage signal (no push alert).
# `stale_sources` = 断流 (no success within 48h) and is the only thing that fails
# the report job; `incomplete` = coverage gap (latest manifest not complete) and
# is NOT an outage — zero-new runs never write a new manifest, so an accepted
# out-of-scope gap can persist there while the source stays fresh. new_today=0
# is healthy, never stale.
legalSources:
  secretName: flk-law-crawl-credentials
  lawsBucket: laws
  rustfs:
    endpoint: ""        # 内网端点 → values-private.yaml（required 守卫）
    region: us-east-1
  postgres:
    # PG env for loaders + report (report gains PG in this change: the new
    # report code reads law_db; live report has no PG env yet - accepted diff).
    host: ""            # 内网主机 → values-private.yaml（required 守卫）
    port: "5432"
    database: law_db
    secretName: flk-law-pg-credentials
    userKey: pg-user
    passwordKey: pg-password
  sources:
    rmfyalk-case-library:
      name: rmfyalk-case-crawl
      schedule: "10 3 * * *"
      suspend: true
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 21600
      # Live runs the auth-broker image (browser runtime bundled), pinned to
      # the account identity; auth envs come from Secrets.
      sourceLabel: true
      podLabels:
        # `__ACCOUNT_ID__` 是图表内的替换令牌，由 private.accountId 代入
        # （见 _helpers.tpl `helm-law-scraw.subst`）。真实账号标识不进 git。
        legal.finddata.io/account: __ACCOUNT_ID__
      image:
        # rmfyalk crawl needs only bin/lib (main image); dual-mode platform session since sha-c14bb59.
        # sha-9fdb6b1 adds curl (proxy-fetch shells out; missing curl made every
        # proxied list request fail "spawn curl ENOENT" -> listed=0 fake success).
        # sha-9eb5c72 carries identity_alias into crawl_runs.startRun (FD_ACCOUNT
        # -> runs traceable to the leased identity). Built via server2 delta
        # (GitHub billing blocks private-repo Actions).
        # sha-7d89e71: incremental identity keys stabilised (case_no identity) —
        # without it every run re-fetches the whole corpus (change
        # rmfyalk-incremental-identity).
        # 2026-10-14: unified onto the line tag sha-b63d0d1 (report semantics
        # fix; crawl code identical between the two — see 7d89e71..b63d0d1).
        registry: ccr.ccs.tencentyun.com
        repository: lawcraw-business/fd-law-data
        tag: sha-c33bf67
      command:
        - node
        - bin/rmfyalk-crawl.mjs
        - --account-id
        - __ACCOUNT_ID__
        - --auth-broker
        - http://legal-auth-broker.scraw
        - --rate-ms
        - "1100"
      extraEnv:
        - name: LEGAL_AUTH_BROKER_TOKEN
          valueFrom:
            secretKeyRef:
              name: legal-auth-broker
              key: broker-token
        - name: LEGAL_AUTH_JAR_KEY
          valueFrom:
            secretKeyRef:
              name: legal-auth-broker
              key: jar-key
        - name: LEGAL_AUTH_CRAWL_PROXY_URL
          valueFrom:
            secretKeyRef:
              name: legal-identity-rmfyalk-__ACCOUNT_ID__
              key: crawl_proxy_url
        - name: LEGAL_AUTH_LOGIN_PROXY_URL
          valueFrom:
            secretKeyRef:
              name: legal-identity-rmfyalk-__ACCOUNT_ID__
              key: login_proxy_url
    mfa-treaty-library:
      name: mfa-treaty-crawl
      schedule: "20 3 * * *"
      suspend: false
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 28800
      sourceLabel: true
      command: ["node", "bin/mfa-treaty-crawl.mjs", "--rate-ms", "1100"]
    gov-rules-library:
      name: gov-rules-crawl
      schedule: "30 3 * * *"
      suspend: false
      concurrencyPolicy: Forbid
      # == live。2026-11-14 核对：chart 原来写 14400（4h），线上已是 28800——
      # 09-24 那笔 `96b6892` 把四个 catalog 爬虫的墙抬到 8h（CCDI 撞过 4h 墙），
      # 只改了清单没回写 chart。整份 apply 会把墙砍回 4h，慢轮直接被杀。
      activeDeadlineSeconds: 28800
      sourceLabel: true
      command: ["node", "bin/gov-rules-crawl.mjs", "--rate-ms", "1100"]
    party-regulation-library:
      name: party-regulation-crawl
      schedule: "40 3 * * *"
      # 2026-11-14 切换试点：本源的执行者迁到 xinru-server1（裁定见 APPLY-NOTES
      # 「宿主切换」）。两侧必须同一次改动里翻，只翻一侧＝两个执行者写同一张
      # crawl_runs。`make verify-sites` 拒「两边都活」。
      suspend: true
      concurrencyPolicy: Forbid
      # == live（同上，14400 → 28800）。
      activeDeadlineSeconds: 28800
      sourceLabel: true
      command: ["node", "bin/party-regulation-crawl.mjs", "--rate-ms", "1100"]
    ccdi-supervisory-regulations:
      name: ccdi-supervisory-crawl
      schedule: "50 3 * * *"
      # == live (lit 2026-10-10 after the 点亮门; reconverged 2026-10-14 —
      # live had already been unsuspended outside the chart).
      suspend: false
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 28800
      sourceLabel: true
      command: ["node", "bin/ccdi-supervisory-crawl.mjs", "--rate-ms", "1100"]
    flk-law-backfill:
      name: flk-law-backfill
      schedule: "0 */4 * * *"
      suspend: true
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 21600
      # Live backfill pod carries no legal.finddata.io/source label.
      sourceLabel: false
      command:
        - node
        - bin/flk-crawl.mjs
        - --backfill
        - --batch-days
        - "365"
      extraEnv:
        - name: FLK_PAGE_SIZE
          value: "100"
        - name: FLK_RATE_MS
          value: "1100"
  loaders:
    # One CronJob per source; names match live (no release prefix). Container
    # name `loader`, OnFailure, Forbid, activeDeadlineSeconds 7200 (default).
    rmfyalk-case-load:
      schedule: "30 5 * * *"
      # == live (reconverged 2026-10-14; live had been unsuspended outside the
      # chart — the load side only reads the bucket so it is safe lit).
      suspend: false
      source: rmfyalk-case-library
      command: ["node", "bin/rmfyalk-load.mjs", "--source", "rmfyalk-case-library"]
    mfa-treaty-load:
      schedule: "40 4 * * *"
      suspend: false
      source: mfa-treaty-library
      command: ["node", "bin/mfa-treaty-load.mjs", "--source", "mfa-treaty-library"]
    gov-rules-load:
      schedule: "50 4 * * *"
      suspend: false
      source: gov-rules-library
      command: ["node", "bin/gov-rules-load.mjs", "--source", "gov-rules-library"]
    party-regulation-load:
      schedule: "0 5 * * *"
      suspend: false
      source: party-regulation-library
      command: ["node", "bin/party-regulation-load.mjs", "--source", "party-regulation-library"]
    ccdi-supervisory-load:
      schedule: "10 5 * * *"
      # == live (reconverged 2026-10-14; lit outside the chart with its crawl).
      suspend: false
      source: ccdi-supervisory-regulations
      command: ["node", "bin/ccdi-supervisory-load.mjs", "--source", "ccdi-supervisory-regulations"]
    flk-law-load:
      # 04:30，接在 flk-law-crawl（02:30 写 incremental/）之后、flk-law-embed（05:30
      # 读 laws-export 分片）之前。本作业在 chart 里**从未存在过**：2026-10-06
      # 建 loaders 这一段时漏了它，于是 flk 的 load 环节自那天起停摆——爬取照常
      # 往 S3 写分片（10-09/10-11/10-13/10-17/10-21/10-28/10-29/10-31/11-07/11-11/
      # 11-12 共 11 份），law_db.laws 的 flk 行却停在 2026-09-24，laws-export 没有
      # 新分片，embed 每天「success rows=0」。2026-11-14 已用一次性 Pod 补齐
      # （insertedLaws=59、chunks=2031、exportShards=10，laws 3245→3304），
      # 但那是手工补的，不解决每天新增的积压。
      #
      # ✅ 2026-11-14 点亮。判据是**镜像内容**，不是 tag（tag 是镜像仓 commit
      #   短 sha、与源码 sha 不同源，本作业曾因此误点亮过一次）：
      #   ① `grep -n "to_jsonb(laws)" /app/lib/law/identity.js` 有命中
      #      （sha-492925f 的第 49/56 行，已核）；
      #   ② 真代码路径：在该镜像里对真 law_db 调 findCrossGenerationDuplicate
      #      —— 已存在的标题 → true、不存在的 → false、无 42703（已核）。
      #   回归红线：旧片裸投影 doc_number，而生产 laws 表没有这一列 ⇒ 每条
      #   记录抛 42703、整批一条也写不进去，只在 crawl_runs 留一行 running
      #   然后被预算回收。任何一次抬 tag 之前，先重跑 ① ② 再谈启用。
      schedule: "30 4 * * *"
      suspend: false
      source: flk-law
      activeDeadlineSeconds: 7200
      command: ["node", "bin/flk-load.mjs"]
  telemetry:
    secretName: federation-db
    urlKey: url
  # V8 堆上限。09-24 `96b6892` 实测：跑的这台只有 3.7GB，堆过 ~800MB 就被内核
  # OOM-kill（不是内存泄漏，list 阶段的分配抖动就够）。此前只加在 k8s/ 那份
  # 「仅作参考」清单里，线上 12 个作业是手工带上这个 env 的——chart 缺它，
  # 换命名空间/新集群时就丢，回来就是节点级 OOM。空串表示不加这个 env。
  nodeOptions: "--max-old-space-size=384"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi
  report:
    name: legal-sources-report
    schedule: "0 6 * * *"
    suspend: false
    concurrencyPolicy: Forbid
    activeDeadlineSeconds: 1800
    # 收编 2026-11-10：现场跑的一直是那份**已废弃的** k8s/legal-source-crawl-cronjobs.yaml
    # 里的 sh -c 形态（跑完脚本再把自己记进 crawl_runs），而 chart 里只是裸跑脚本 ——
    # 于是「chart 是真相」这句话在这一个对象上是假的，谁 apply chart 谁就把
    # legal-sources-report 的 run 记录弄丢。这里把现场形态搬进 chart，并补上
    # load_stalled：
    #   · 旧记录器只把 stale_sources 写进 error_head，装载停滞完全不可见；
    #   · 新代码（lib/legal-sources/report.js）会给出 load_stalled_sources，
    #     镜像未更新时该字段缺失，join 出来是空串，记录器行为与旧版完全一致（向后兼容）。
    command: ["sh", "-c"]
    args:
      - |
        export FD_RUN_STARTED=$(date +%s)
        node bin/legal-sources-report.mjs > /tmp/report.json 2>/tmp/report.err
        RC=$?
        node -e '
          const fs = require("fs");
          const { Client } = require("pg");
          const rc = Number(process.argv[1]);
          let report = {};
          try { report = JSON.parse(fs.readFileSync("/tmp/report.json", "utf8")); } catch {}
          const rows = Object.values(report.sources || {}).reduce(
            (n, s) => n + (Number(s && s.db && s.db.total_rows) || 0), 0);
          const stale = (report.stale_sources || []).join(",");
          const loadStalled = (report.load_stalled_sources || []).join(",");
          const status = rc === 0 && !stale && !loadStalled ? "success" : "failed";
          const err = [rc ? "exit=" + rc : "",
            stale ? "stale=" + stale : "",
            loadStalled ? "load_stalled=" + loadStalled : "",
            fs.existsSync("/tmp/report.err") ? fs.readFileSync("/tmp/report.err", "utf8").slice(-200) : ""]
            .filter(Boolean).join(" | ").slice(0, 500);
          const url = process.env.FD_CRAWL_DB_URL;
          const t0 = Number(process.env.FD_RUN_STARTED) || Math.floor(Date.now() / 1000);
          const t1 = Math.floor(Date.now() / 1000);
          if (!url) { console.error("report_special_run: no FD_CRAWL_DB_URL; run not recorded"); process.exit(0); }
          (async () => {
            const c = new Client({ connectionString: url });
            await c.connect();
            await c.query(
              "INSERT INTO crawl_runs (source, kind, status, started_at, finished_at, rows_written, error_head) VALUES ($1,$2,$3,to_timestamp($4),to_timestamp($5),$6,$7)",
              ["legal-sources-report", "special-job", status, t0, t1, rows, err || null]);
            await c.end();
            console.log("report_special_run: legal-sources-report", status, "rows=" + rows);
          })().catch(e => { console.error("report_special_run: psql report failed:", e.message); process.exit(0); });
        ' "$RC" || true
        exit $RC

# --- legal Auth Broker (login/session lease API) ---
# Provides the isolated browser login runtime and the crawler-facing lease API.
# Account credentials, jar keys and proxy URLs are injected from Secrets; none
# are stored in this chart.
authBroker:
  enabled: true
  # Live object name on xinru is `legal-auth-broker` (no release prefix); the
  # crawlers reach it at http://legal-auth-broker.scraw.
  name: legal-auth-broker
  replicas: 1
  secretName: legal-auth-broker
  identitySecretName: legal-identity-rmfyalk-__ACCOUNT_ID__
  rustfs:
    endpoint: ""        # 内网端点 → values-private.yaml（required 守卫）
    region: us-east-1
  lawsBucket: laws
  postgres:
    host: ""            # 内网主机 → values-private.yaml（required 守卫）
    port: 5432
    database: law_db
    secretName: flk-law-pg-credentials
    userKey: pg-user
    passwordKey: pg-password
  service:
    type: ClusterIP
    port: 80
    targetPort: 8787
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- wenshu incremental crawl (fd-law-data, Playwright browser automation) ---
# Nightly capture of newly published judgments into the `wenshu` bucket
# raw/{y}/{m}/ crawl files. Holds NO PG credentials (loader runs on the data
# machine). The wenshu ACCOUNT reaches the cluster ONLY via the Secret named
# below (local-only values create it; never commit real credentials).
# Nightly start 01:00 Asia/Shanghai; ~20 h deadline; Forbid concurrency.
#
# ⚠ suspend stays TRUE on purpose: running this from a cluster (datacenter IP)
# with the account attached is the one shape wenshu punishes — a cold start from
# an IP that never matched the session's origin. The supported shape is the warm
# browser on the operator Mac; see fd-law-data/README "wenshu". Flipping this to
# false requires sticky egress (design.md D6) plus a resumed account.
wenshuCrawl:
  # Disabled on xinru: no wenshu-crawl CronJob exists in the live cluster (the
  # supported shape is the warm browser on the operator Mac; see README).
  enabled: false
  schedule: "0 17 * * *"        # 01:00 Asia/Shanghai (nodes run UTC)
  suspend: true
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 72000  # ~20 h; budget enforcement also inside the crawler (19 h default)
  secretName: wenshu-crawl-credentials   # keys: rustfs-access-key, rustfs-secret-key, wenshu-account-user, wenshu-account-password
  wenshuBucket: wenshu
  rateMs: 1000                  # ~1 doc/s on detail fetches
  lookbackDays: 7
  resultCap: 200
  budgetMs: "68400000"          # 19 h internal budget (string to avoid float rendering)
  proxyUrl: ""                  # sticky exit IP via fd-proxy-service (design.md D6); "" = direct
  rustfs:
    endpoint: ""        # 内网端点 → values-private.yaml（required 守卫）
    region: us-east-1

# --- 带外私有值（真源 values-private.yaml，已 gitignore）------------------------
# 内网端点、PG 主机、法务身份标识都不进 git。缺值时图表**渲染即报错**（模板里的
# required 守卫），不会静默连到一个空地址。
#
# `__ACCOUNT_ID__` 是图表内的替换令牌：账号标识同时出现在 pod label 值、crawler
# 命令行参数和身份 Secret 名里，三者必须同源，所以统一由 private.accountId 代入
# （见 _helpers.tpl `helm-law-scraw.subst`）。
private:
  accountId: ""

# Bitnami subcharts
redis:
  # Disabled on xinru: no redis StatefulSet/Service exists in the live cluster.
  enabled: false
  architecture: standalone
  # Auth is disabled by default because the chart's Redis URL has no password.
  # If you enable auth, update _helpers.tpl to include the password in the URL.
  auth:
    enabled: false

postgresql:
  # Disabled on xinru: PG lives off-cluster（主机见 values-private.yaml，凭据在
  # flk-law-pg-credentials）; no in-chart postgresql exists in the live cluster.
  enabled: false
  auth:
    # Set a password or leave empty; Bitnami generates one if empty.
    postgresPassword: "changeme"
    database: scraw