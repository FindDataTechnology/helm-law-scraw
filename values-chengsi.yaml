# chengsi (tencent 集群) 安装 overlay — 法律线迁移（change legal-line-federation）
# 切换前全部 suspend；imagePullSecrets 走 ccr-pull（节点无 ccr 认证）
imageCredentials:
  existingSecret: ccr-pull
flkLawCrawl:
  suspend: true
legalSources:
  sources:
    rmfyalk-case-library:
      suspend: true
    mfa-treaty-library:
      suspend: true
    gov-rules-library:
      suspend: true
    party-regulation-library:
      suspend: true
    ccdi-supervisory-regulations:
      suspend: true
  loaders:
    rmfyalk-case-load:
      suspend: true
    mfa-treaty-load:
      suspend: true
    gov-rules-load:
      suspend: true
    party-regulation-load:
      suspend: true
    ccdi-supervisory-load:
      suspend: true
    # base(values.yaml) 里 flk-law-load 是 false；不写这一行 = 继承 false，
    # 「全部 suspend」在渲染产物上就不成立（2026-11-14 互斥闸抓到）。
    flk-law-load:
      suspend: true
  report:
    suspend: true
flkLawEmbed:
  suspend: true
